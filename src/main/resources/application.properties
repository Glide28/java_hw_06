spring.application.name=hello-spring-jdbc
server.port=8080
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/messages_db}
spring.datasource.username=${DB_USER:messages_user}
spring.datasource.password=${DB_PASSWORD:messages_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

logging.level.org.springframework.jdbc.core=INFO
